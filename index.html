<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Книга контактів</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="container" id="contactApp">
    <h1>Книга контактів</h1>
    
    <form id="contactForm">
      <input type="text" id="firstName" placeholder="Ім'я" required />
      <input type="text" id="lastName" placeholder="Прізвище" required />
      <input type="tel" id="phone" placeholder="Телефон" required />
      <input type="email" id="email" placeholder="Електронна пошта" required />
      <button type="submit" id="saveContactBtn">Додати</button>
    </form>

    <ul id="contactList"></ul>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
